<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sky Isolation Test</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: monospace; }
    canvas { display: block; }
    #info { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.7); padding: 10px; }
  </style>
</head>
<body>
  <div id="info">Sky Isolation Test - Checking RGB values...</div>
  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 8000);
    camera.position.set(0, 2, 0);
    camera.lookAt(0, 2, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // Test fog (like game)
    const horizonBlue = new THREE.Color(0xc0ddf5);
    scene.fog = new THREE.Fog(horizonBlue, 800, 1400);

    // Sky dome (simplified from alpine.js)
    const deepBlue = new THREE.Color(0x2277dd);
    const dome = new THREE.Mesh(
      new THREE.SphereGeometry(450000, 32, 16),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        depthTest: false,
        uniforms: {
          uHor: { value: horizonBlue },
          uTop: { value: deepBlue }
        },
        vertexShader: `
          varying vec3 vD;
          void main() {
            vD = normalize(position);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 uHor, uTop;
          varying vec3 vD;
          void main() {
            float h = clamp(vD.y, 0.0, 1.0);
            vec3 c = mix(uHor, uTop, pow(h, 0.35));
            gl_FragColor = vec4(c, 1.0);
          }
        `
      })
    );
    dome.frustumCulled = false;
    dome.renderOrder = -999;
    scene.add(dome);

    renderer.render(scene, camera);

    // Sample pixels
    const canvas = renderer.domElement;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const w = canvas.width;
    const h = canvas.height;

    // Zenith (top center)
    const zenithData = ctx.getImageData(w/2, 10, 1, 1).data;
    const zenith = `rgb(${zenithData[0]}, ${zenithData[1]}, ${zenithData[2]})`;

    // Mid sky
    const midData = ctx.getImageData(w/2, h/3, 1, 1).data;
    const mid = `rgb(${midData[0]}, ${midData[1]}, ${midData[2]})`;

    // Horizon
    const horizonData = ctx.getImageData(w/2, h - 50, 1, 1).data;
    const horizon = `rgb(${horizonData[0]}, ${horizonData[1]}, ${horizonData[2]})`;

    const info = document.getElementById('info');
    info.innerHTML = `
      <strong>Sky Isolation Test</strong><br>
      Zenith (top): ${zenith}<br>
      Mid (1/3 down): ${mid}<br>
      Horizon (bottom): ${horizon}<br>
      <br>
      Target:<br>
      Zenith: ~rgb(40,110,220)<br>
      Mid: ~rgb(90,160,240)<br>
      Horizon: ~rgb(180,215,250)<br>
      <br>
      ACES ToneMapping: ${renderer.toneMapping === THREE.ACESFilmicToneMapping}<br>
      Exposure: ${renderer.toneMappingExposure}<br>
      Fog: ${scene.fog ? 'yes' : 'no'}
    `;

    console.log('Zenith RGB:', zenithData[0], zenithData[1], zenithData[2]);
    console.log('Mid RGB:', midData[0], midData[1], midData[2]);
    console.log('Horizon RGB:', horizonData[0], horizonData[1], horizonData[2]);
  </script>
</body>
</html>
