<!DOCTYPE html>
<html>
<head>
  <title>Simple Cow Test</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 10);
    camera.lookAt(0, 1, 0);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    
    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshStandardMaterial({ color: 0x55aa45 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    
    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    
    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(10, 20, 10);
    sun.castShadow = true;
    scene.add(sun);
    
    // SIMPLE COW - white body + brown head
    const cowGroup = new THREE.Group();
    
    // Body (white)
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(2.5, 1.5, 1.2),
      new THREE.MeshStandardMaterial({ color: 0xf8f5f0 })
    );
    body.position.y = 1.5;
    body.castShadow = true;
    cowGroup.add(body);
    
    // Head (brown)
    const head = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 0.7, 0.7),
      new THREE.MeshStandardMaterial({ color: 0x6b4423 })
    );
    head.position.set(1.5, 1.7, 0);
    head.castShadow = true;
    cowGroup.add(head);
    
    // Legs
    [[0.8, 0.65, 0.5], [0.8, 0.65, -0.5], [-0.8, 0.65, 0.5], [-0.8, 0.65, -0.5]].forEach(([x, y, z]) => {
      const leg = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.15, 1.3, 8),
        new THREE.MeshStandardMaterial({ color: 0x3d2817 })
      );
      leg.position.set(x, y, z);
      leg.castShadow = true;
      cowGroup.add(leg);
    });
    
    cowGroup.position.set(0, 0, 0);
    scene.add(cowGroup);
    
    console.log('Cow group added:', cowGroup);
    console.log('Scene children:', scene.children.length);
    
    function animate() {
      requestAnimationFrame(animate);
      cowGroup.rotation.y += 0.005;
      renderer.render(scene, camera);
    }
    animate();
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
